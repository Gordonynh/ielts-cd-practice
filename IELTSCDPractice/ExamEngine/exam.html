<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>IELTS</title>
    <link rel="stylesheet" href="exam.css">
</head>
<body>
    <header class="ielts-header">
        <div class="ielts-logo" aria-label="IELTS">IELTS</div>
        <div class="candidate">
            <span>Test taker ID</span>
            <strong id="candidate-id">—</strong>
        </div>
        <button class="timer" id="timer" type="button" aria-live="polite">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5"></path><path d="M9.5 2.5h5"></path>
            </svg>
            <span class="timer-text" id="timer-text"></span>
        </button>
        <div class="audio-player" id="audio-player" hidden>
            <button class="ap-icon" id="ap-back" type="button" aria-label="Back 5 seconds">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
                <span>5</span>
            </button>
            <button class="ap-play" id="ap-play" type="button" aria-label="Play">
                <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"></path></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"></rect><rect x="14" y="4.5" width="4" height="15" rx="1"></rect></svg>
            </button>
            <button class="ap-icon" id="ap-forward" type="button" aria-label="Forward 5 seconds">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><polyline points="21 3 21 8 16 8"></polyline></svg>
                <span>5</span>
            </button>
            <input class="ap-seek" id="ap-seek" type="range" min="0" max="1000" value="0" aria-label="Audio position">
            <span class="ap-time" id="ap-time">0:00 / 0:00</span>
            <button class="ap-rate" id="ap-rate" type="button" aria-label="Playback speed">1.0×</button>
        </div>
        <div class="header-tools">
            <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </span>
            <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            </span>
            <button class="icon" id="menu-button" type="button" aria-label="Options">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </header>

    <section class="part-banner" id="part-banner">
        <div class="part-title" id="part-title">Part 1</div>
        <div class="part-instruction" id="part-instruction"></div>
    </section>

    <main class="workspace" id="workspace">
        <div class="nav-arrows">
            <button type="button" id="prev-question" aria-label="Previous question">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button type="button" id="next-question" aria-label="Next question">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
    </main>

    <nav class="footer-nav" aria-label="Question navigation">
        <button class="review-toggle" id="review-toggle" type="button" aria-pressed="false">
            <span class="review-box" aria-hidden="true"></span>
            <span>Review</span>
        </button>
        <div class="nav-parts" id="nav-parts"></div>
        <button class="submit-btn" id="submit-button" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span id="submit-label">Submit</span>
        </button>
    </nav>

    <!-- 每个部分开始前的说明页（与官方机考 Instructions 页一致） -->
    <section class="intro-screen" id="intro" hidden>
        <div class="intro-body">
            <h1 id="intro-title"></h1>
            <p class="intro-time" id="intro-time"></p>
            <h2>Instructions to candidates</h2>
            <ul id="intro-instructions"></ul>
            <h2>Information for candidates</h2>
            <ul id="intro-information"></ul>
            <div class="intro-actions">
                <button type="button" class="intro-start" id="intro-start">Start test</button>
            </div>
        </div>
    </section>

    <!-- 模考结束页 -->
    <section class="intro-screen finish-screen" id="finish" hidden>
        <div class="intro-body">
            <h1 id="finish-title"></h1>
            <p id="finish-message"></p>
            <div class="intro-actions">
                <button type="button" class="intro-start" id="finish-button">View results</button>
            </div>
        </div>
    </section>

    <div class="scrim" id="scrim"></div>

    <div class="popover options-menu" id="options-menu" role="menu">
        <h3>Contrast</h3>
        <button class="option-row" data-contrast="standard" type="button"><span class="check">✓</span><span class="swatch" style="background:#fff;color:#000">Aa</span>Black on white</button>
        <button class="option-row" data-contrast="inverse" type="button"><span class="check">✓</span><span class="swatch" style="background:#000;color:#fff">Aa</span>White on black</button>
        <button class="option-row" data-contrast="yellow" type="button"><span class="check">✓</span><span class="swatch" style="background:#000;color:#ffeb3b">Aa</span>Yellow on black</button>
        <hr>
        <h3>Text size</h3>
        <button class="option-row" data-text-size="regular" type="button"><span class="check">✓</span>Regular</button>
        <button class="option-row" data-text-size="large" type="button"><span class="check">✓</span>Large</button>
        <button class="option-row" data-text-size="xlarge" type="button"><span class="check">✓</span>Extra large</button>
        <hr>
        <button class="option-row" id="toggle-timer-visibility" type="button"><span class="check">✓</span>Hide time remaining</button>
        <button class="option-row danger" id="exit-button" type="button"><span class="check"></span>Exit</button>
    </div>

    <div class="popover dialog" id="dialog" role="dialog" aria-modal="true">
        <h2 id="dialog-title"></h2>
        <p id="dialog-message"></p>
        <div class="actions">
            <button type="button" id="dialog-cancel">Cancel</button>
            <button type="button" class="primary" id="dialog-confirm">OK</button>
        </div>
    </div>

    <div class="popover note-editor" id="note-editor" role="dialog">
        <header><span>Notes</span><button type="button" id="note-close">Done</button></header>
        <p class="quote" id="note-quote"></p>
        <textarea id="note-text" placeholder="Type your note here" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" writingsuggestions="false" lang="en"></textarea>
        <footer>
            <button type="button" class="delete" id="note-delete">Clear highlight</button>
            <button type="button" class="save" id="note-save">Save</button>
        </footer>
    </div>

    <!-- 右键菜单（与官方机考一致：Highlight / Notes / Clear） -->
    <div class="context-menu" id="context-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-action="highlight">Highlight</button>
        <button type="button" role="menuitem" data-action="note">Notes</button>
        <button type="button" role="menuitem" data-action="clear">Clear</button>
        <button type="button" role="menuitem" data-action="clear-all">Clear all</button>
        <hr>
        <button type="button" role="menuitem" data-action="vocab">加入生词本</button>
    </div>

    <div class="toast" id="toast"></div>

    <script src="exam.js"></script>
</body>
</html>
